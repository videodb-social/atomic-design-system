<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — VideoDB Atomic Design System</title>
<meta name="description" content="The requested page was not found in the VideoDB atomic design system.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --orange-500: #F24E1E;
  --orange-600: #D14016;
  --white: #FFFFFF;
  --neutral-dark: #0A0A0A;
  --text-on-dark: #FFFFFF;
  --text-on-dark-subtle: rgba(255, 255, 255, 0.65);
  --r-control: 9999px;
  --ease-ui: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 160ms;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--neutral-dark);
  color: var(--text-on-dark);
}

a { color: inherit; text-decoration: none; }

.ds-error-page {
  position: relative;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 48px 24px;
  background:
    radial-gradient(circle at 50% 28%, rgba(242, 78, 30, 0.17), transparent 34%),
    radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.045), transparent 26%),
    linear-gradient(180deg, #0A0A0A 0%, #080808 52%, #050505 100%);
}

.ds-error-page::before,
.ds-error-page::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.ds-error-page::before {
  background: radial-gradient(ellipse at center, transparent 0%, transparent 42%, rgba(0, 0, 0, 0.58) 100%);
}

.ds-error-page::after {
  background: linear-gradient(180deg, transparent 0%, transparent 78%, rgba(255, 255, 255, 0.035) 100%);
  opacity: 0.7;
}

.ds-error-card {
  position: relative;
  z-index: 1;
  width: min(100%, 620px);
  text-align: center;
}

.ds-error-code {
  margin: 0 0 32px;
  font-size: clamp(96px, 14vw, 188px);
  font-weight: 300;
  line-height: 0.82;
  letter-spacing: -0.08em;
  color: rgba(255, 255, 255, 0.34);
}

.ds-error-title {
  margin: 0;
  font-size: clamp(28px, 4vw, 36px);
  font-weight: 400;
  line-height: 1.18;
  letter-spacing: -0.035em;
}

.ds-error-copy {
  max-width: 520px;
  margin: 24px auto 0;
  color: var(--text-on-dark-subtle);
  font-size: clamp(18px, 2.4vw, 24px);
  line-height: 1.38;
  letter-spacing: -0.02em;
}

.ds-error-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 28px;
}

.ds-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  padding: 13px 22px;
  border: 0;
  border-radius: var(--r-control);
  font-family: inherit;
  font-size: 20px;
  font-weight: 400;
  line-height: 1;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-ui), color var(--dur-fast) var(--ease-ui), transform 96ms var(--ease-ui), border-color var(--dur-fast) var(--ease-ui);
}

.ds-btn:hover { transform: translateY(-1px); }
.ds-btn:active { transform: scale(0.985); }
.ds-btn:focus-visible { outline: 2px solid rgba(242, 78, 30, 0.75); outline-offset: 3px; }

.ds-btn--primary {
  background: var(--orange-500);
  color: var(--white);
}

.ds-btn--primary:hover { background: var(--orange-600); }

@media (max-width: 560px) {
  .ds-error-page { padding: 40px 20px; }
  .ds-error-code { margin-bottom: 28px; }
  .ds-error-copy { margin-top: 18px; }
  .ds-error-actions { gap: 12px; }
  .ds-btn { width: 100%; font-size: 17px; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>
  <main class="ds-error-page" aria-labelledby="error-title">
    <section class="ds-error-card">
      <p class="ds-error-code" aria-hidden="true">404</p>
      <h1 class="ds-error-title" id="error-title">This pattern is not in the system yet.</h1>
      <p class="ds-error-copy">The route may be broken, renamed, or outside the current VideoDB atomic design system.</p>
      <div class="ds-error-actions" aria-label="404 actions">
        <a class="ds-btn ds-btn--primary" href="index.html">Back to design system</a>
      </div>
    </section>
  </main>
</body>
</html>
